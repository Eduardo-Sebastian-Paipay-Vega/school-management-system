name: CI

# Puertas de calidad de AGENTS.md §3 y D-13: lint, tipos, pruebas y build de cada proyecto.
# No despliega nada ni usa secretos. Cada proyecto se instala por separado (no hay workspaces, D-12).
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_CORE_API_URL: http://localhost:3001
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend común (lint + build + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # npm test compila con tsc y ejecuta tests/*.test.cjs sobre dist/.
      - run: npm test

  grades:
    name: Servicio M8 (tipos + pruebas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/squad_3_calificaciones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/squad_3_calificaciones/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  database:
    name: Migraciones (PGlite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: database/package-lock.json
      - run: npm ci
      - run: npm test

  contracts:
    name: Contratos OpenAPI (lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:inventory
      - run: npm run check:generated

  core-integration:
    name: Core (PostgreSQL + Redis, dos tenants)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration_only_password
          POSTGRES_DB: school_management
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_management"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:integration_only_password@localhost:5432/school_management
      INTEGRATION_DATABASE_URL: postgres://postgres:integration_only_password@localhost:5432/school_management
      APP_DB_USER: sms_runtime
      APP_DB_PASSWORD: integration_only_runtime_password_2026
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: school_management
      DB_USER: sms_runtime
      DB_PASSWORD: integration_only_runtime_password_2026
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: integration_only_access_secret_2026_very_long
      JWT_REFRESH_SECRET: integration_only_refresh_secret_2026_very_long
      ENCRYPTION_MASTER_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      DOCUMENT_HMAC_KEY: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            database/package-lock.json
            backend/package-lock.json
      - name: Instalar migrador
        run: npm ci
        working-directory: database
      - name: Crear esquema versionado
        run: npm run migrate
        working-directory: database
      - name: Crear rol de ejecución sin BYPASSRLS
        run: npm run bootstrap:app-role
        working-directory: database
      - name: Instalar backend
        run: npm ci
        working-directory: backend
      - name: Probar aislamiento y fallo cerrado
        run: npm run test:integration
        working-directory: backend
