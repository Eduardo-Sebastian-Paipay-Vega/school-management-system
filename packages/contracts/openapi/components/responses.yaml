Health:
  description: Estado de PostgreSQL, Redis y particiones de auditoría
  content:
    application/json:
      schema:
        type: object
        required: [status, timestamp, services]
        properties:
          status: { type: string, enum: [OK, DEGRADED] }
          timestamp: { type: string, format: date-time }
          services:
            type: object
            required: [database, redis, auditPartitions]
            properties:
              database: { type: string, enum: [CONNECTED, DISCONNECTED] }
              redis: { type: string, enum: [CONNECTED, DISCONNECTED] }
              auditPartitions:
                type: string
                enum: [OK, MISSING_NEXT_MONTH, MISSING_CURRENT_MONTH, UNKNOWN]
                description: >-
                  Particiones UTC de logs_auditoria. MISSING_NEXT_MONTH es un aviso (HTTP 200);
                  MISSING_CURRENT_MONTH implica escrituras auditadas fallando cerradas (HTTP 503).
                  Ver docs/core/OPERACION_CORE.md.
