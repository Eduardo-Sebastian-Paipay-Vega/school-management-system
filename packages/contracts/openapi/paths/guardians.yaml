/guardians/consent:
  get: { operationId: getGuardianConsent, security: [], responses: { '200': { $ref: '../components/responses.yaml#/GuardianConsent' }, '503': { $ref: '../components/responses.yaml#/Error' } } }
  delete: { operationId: revokeGuardianConsent, description: 'Revoca el consentimiento vigente y todas las sesiones del apoderado.', responses: { '200': { $ref: '../components/responses.yaml#/Message' }, '404': { $ref: '../components/responses.yaml#/Error' } } }
/guardians/activate:
  post: { operationId: activateGuardian, security: [], description: 'Exige versión vigente del texto y aceptación explícita; la verificación real de ficha sigue bloqueada.', responses: { '200': { $ref: '../components/responses.yaml#/Message' }, '400': { $ref: '../components/responses.yaml#/Error' }, '503': { $ref: '../components/responses.yaml#/Error' } } }
/guardians/students:
  get: { operationId: listLinkedStudents, description: 'Solo rol APODERADO con vínculo y consentimiento activos; requiere ficha verificadora institucional.', responses: { '200': { $ref: '../components/responses.yaml#/GuardianStudents' }, '503': { $ref: '../components/responses.yaml#/Error' } } }
/guardians/links:
  get: { operationId: listGuardianLinks, responses: { '200': { $ref: '../components/responses.yaml#/Success' } } }
  post: { operationId: createGuardianLink, description: 'La ficha verificadora real requiere contrato de Squad 2; pruebas ficticias solo en CI.', responses: { '201': { $ref: '../components/responses.yaml#/GuardianLinkCreated' }, '409': { $ref: '../components/responses.yaml#/Error' }, '503': { $ref: '../components/responses.yaml#/Error' } } }
/guardians/invitations:
  post: { operationId: inviteGuardian, responses: { '200': { $ref: '../components/responses.yaml#/Message' }, '503': { $ref: '../components/responses.yaml#/Error' } } }
/guardians/links/{guardianId}/{studentId}:
  parameters:
    - { $ref: '../components/parameters.yaml#/GuardianId' }
    - { $ref: '../components/parameters.yaml#/StudentId' }
  delete: { operationId: revokeGuardianLink, responses: { '200': { $ref: '../components/responses.yaml#/Success' } } }
