LoginRequest:
  type: object
  required: [codigoModular, identifier, password]
  properties:
    codigoModular: { type: string, maxLength: 10 }
    identifier: { type: string, maxLength: 254 }
    password: { type: string, format: password, minLength: 1 }
RecoveryRequest:
  type: object
  required: [codigoModular, identifier]
  properties:
    codigoModular: { type: string, maxLength: 10 }
    identifier: { type: string, maxLength: 254 }
AccessLinkRequest:
  type: object
  required: [codigoModular, token, password]
  properties:
    codigoModular: { type: string, maxLength: 10 }
    token: { type: string }
    password: { type: string, format: password, minLength: 8 }
Success:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      description: DTO especifico de la operacion. Las operaciones aun no migradas conservan esta forma generica temporalmente.
    timestamp: { type: string, format: date-time }
Error:
  type: object
  required: [success, error, timestamp]
  properties:
    success: { const: false }
    error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Codigo estable; catalogo transversal en ADR-005. Los codigos de dominio siguen abiertos hasta revision formal.
          examples: [VALIDATION_FAILED, UNAUTHENTICATED, ACCESS_DENIED, TENANT_MISMATCH, RATE_LIMITED, AUTH_UNAVAILABLE]
        message: { type: string }
        details: {}
    timestamp: { type: string, format: date-time }
CoreUser:
  type: object
  required: [id, tenantId, username, fullName, email, roles, permissions]
  properties:
    id: { type: string, format: uuid }
    tenantId: { type: string, format: uuid, description: 'Identificador derivado de la sesion validada, no del cliente.' }
    username: { type: string }
    fullName: { type: string }
    email: { type: [string, 'null'], format: email }
    roles: { type: array, items: { type: string } }
    permissions: { type: array, items: { type: string } }
    sessionId: { type: string, format: uuid, description: Presente en GET /auth/me. }
SessionData:
  type: object
  required: [user, accessToken, expiresIn]
  properties:
    user: { $ref: './schemas.yaml#/CoreUser' }
    accessToken: { type: string }
    expiresIn: { type: integer, const: 900, description: Segundos de vigencia del access token. }
SessionSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data: { $ref: './schemas.yaml#/SessionData' }
    timestamp: { type: string, format: date-time }
MeSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [user]
      properties:
        user: { $ref: './schemas.yaml#/CoreUser' }
    timestamp: { type: string, format: date-time }
MessageSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [message]
      properties:
        message: { type: string }
    timestamp: { type: string, format: date-time }
UserCreatedSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [line, personId]
      properties:
        line: { type: integer, minimum: 2 }
        personId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
    timestamp: { type: string, format: date-time }
UserDirectorySuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [users, count]
      properties:
        users:
          type: array
          items:
            type: object
            required: [id, username, estado, persona_id, nombres, apellido_paterno, roles]
            properties:
              id: { type: string, format: uuid }
              username: { type: string }
              estado: { type: string }
              persona_id: { type: string, format: uuid }
              nombres: { type: string }
              apellido_paterno: { type: string }
              apellido_materno: { type: [string, 'null'] }
              email: { type: [string, 'null'], format: email }
              documento_ultimos4: { type: [string, 'null'] }
              roles: { type: array, items: { type: string } }
        count: { type: integer, minimum: 0 }
    timestamp: { type: string, format: date-time }
ImportSummary:
  type: object
  required: [nuevos, actualizados, sinCambios, rechazados]
  properties:
    nuevos: { type: integer, minimum: 0 }
    actualizados: { type: integer, minimum: 0 }
    sinCambios: { type: integer, minimum: 0 }
    rechazados: { type: integer, minimum: 0 }
ImportRejectedRow:
  type: object
  required: [line, reason]
  properties:
    line: { type: integer, minimum: 2 }
    reason: { type: string }
ImportPreviewSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [valid, rejected, summary]
      properties:
        valid:
          type: array
          items:
            type: object
            required: [line, row, status]
            properties:
              line: { type: integer, minimum: 2 }
              row: { type: object }
              personId: { type: string, format: uuid }
              status: { type: string, enum: [NUEVO, ACTUALIZADO, SIN_CAMBIOS] }
        rejected: { type: array, items: { $ref: './schemas.yaml#/ImportRejectedRow' } }
        summary: { $ref: './schemas.yaml#/ImportSummary' }
    timestamp: { type: string, format: date-time }
ImportCommitSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [nuevos, actualizados, sinCambios, rechazados, registros]
      properties:
        nuevos: { type: integer, minimum: 0 }
        actualizados: { type: integer, minimum: 0 }
        sinCambios: { type: integer, minimum: 0 }
        rechazados: { type: array, items: { $ref: './schemas.yaml#/ImportRejectedRow' } }
        registros:
          type: array
          items:
            type: object
            required: [line, personId]
            properties:
              line: { type: integer, minimum: 2 }
              personId: { type: string, format: uuid }
              userId: { type: string, format: uuid }
    timestamp: { type: string, format: date-time }
GuardianLinkCreatedSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
    timestamp: { type: string, format: date-time }
GuardianStudentsSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: array
      items:
        type: object
        required: [id, nombres, apellido_paterno, parentesco]
        properties:
          id: { type: string, format: uuid }
          nombres: { type: string }
          apellido_paterno: { type: string }
          apellido_materno: { type: [string, 'null'] }
          parentesco: { type: string, enum: [PADRE, MADRE, TUTOR_LEGAL] }
    timestamp: { type: string, format: date-time }
AuditLogsSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [logs, count]
      properties:
        logs:
          type: array
          items:
            type: object
            required: [id, modulo, accion, timestamp_utc]
            properties:
              id: { type: string, pattern: '^[0-9]+$' }
              usuario_id: { type: [string, 'null'], format: uuid }
              modulo: { type: string }
              accion: { type: string }
              timestamp_utc: { type: string, format: date-time }
        count: { type: integer, minimum: 0 }
    timestamp: { type: string, format: date-time }
AuditChainSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [valid, totalRecords]
      properties:
        valid: { type: boolean }
        totalRecords: { type: integer, minimum: 0 }
        errorIndex: { type: integer, minimum: 0 }
    timestamp: { type: string, format: date-time }
GuardianConsentSuccess:
  type: object
  required: [success, data, timestamp]
  properties:
    success: { const: true }
    data:
      type: object
      required: [version, text]
      properties:
        version: { type: string, maxLength: 20 }
        text: { type: string, minLength: 100 }
    timestamp: { type: string, format: date-time }
