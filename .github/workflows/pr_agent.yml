name: PR Agent

# Revisión automática de Pull Requests con PR-Agent (https://github.com/qodo-ai/pr-agent).
# Requiere el secret ANTHROPIC_KEY en Settings > Secrets and variables > Actions.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    name: Revisar PR y responder comandos (/review, /describe, /improve)
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_KEY }}
          CONFIG.MODEL: "anthropic/claude-opus-5-5"
          CONFIG.FALLBACK_MODELS: '["anthropic/claude-sonnet-5"]'
          CONFIG.RESPONSE_LANGUAGE: "es-PE"
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: "true"
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: "true"
